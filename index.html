<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل التدشين - هيئة الدفاع المدني والإسعاف</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b261d 0%, #080d09 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1.5px, transparent 1.5px);
            background-size: 35px 35px;
            pointer-events: none;
        }

        #launch-container {
            text-align: center;
            transition: all 0.8s ease-in-out;
            padding: 20px;
            z-index: 10;
            max-width: 900px;
        }

        /* شعار الهيئة بتصميم ذهبي فاخر وبارز */
        .logo-container {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .authority-logo {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 6px 15px rgba(212, 175, 55, 0.45));
            animation: float-logo 3s ease-in-out infinite;
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .authority-badge {
            font-size: 1.05rem;
            color: #D4AF37;
            letter-spacing: 2.5px;
            margin-bottom: 15px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* حقل اسم الضيف واللقب المفتوح لتعديله لاحقاً */
        .patronage {
            font-size: 1.4rem;
            color: #E2E8F0;
            margin-bottom: 20px;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
            letter-spacing: 0.5px;
        }

        .patronage span {
            color: #D4AF37;
            font-weight: 800;
            border-bottom: 2px dashed #D4AF37;
            padding-bottom: 2px;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
            background: linear-gradient(135deg, #fff 20%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }

        .launch-btn-wrapper {
            position: relative;
            display: inline-block;
            padding: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212,175,55,0.4), rgba(46,75,51,0.2));
            animation: pulse-glow 2.5s infinite;
        }

        .launch-btn {
            background: radial-gradient(circle at 30% 30%, #2e4b33 0%, #0e1710 100%);
            color: #D4AF37;
            border: 4px solid #D4AF37;
            width: 220px;
            height: 220px;
            font-size: 1.7rem;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 5px 20px rgba(212,175,55,0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.5;
            outline: none;
        }

        .launch-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.6), inset 0 5px 25px rgba(212,175,55,0.6);
            background: radial-gradient(circle at 30% 30%, #3a5e41 0%, #152217 100%);
            color: #fff;
        }

        .launch-btn:active {
            transform: scale(0.96);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 25px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 1000;
        }

        #video-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
            z-index: 1001;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="launch-container">
        <!-- شعار الهيئة الرسمي المدمج بدقة عالية -->
        <div class="logo-container">
            <svg class="authority-logo" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                <!-- خلفية دائرية خفيفة للشعار -->
                <circle cx="250" cy="250" r="230" fill="#0e1710" stroke="#D4AF37" stroke-width="6" opacity="0.85"/>
                <!-- زخرفة الخنجر والسيوف العمانية الذهبية -->
                <g fill="#D4AF37">
                    <!-- سيفين متقاطعين -->
                    <path d="M100,100 L400,400 M100,400 L400,100" stroke="#D4AF37" stroke-width="14" stroke-linecap="round"/>
                    <!-- مقبض الخنجر العماني -->
                    <path d="M220,130 C220,110 280,110 280,130 L270,210 C270,220 230,220 230,210 Z" fill="#D4AF37"/>
                    <!-- نصل وخنجر عماني فخم -->
                    <path d="M190,260 C230,290 280,260 310,220 C320,240 290,310 230,310 C180,310 170,280 190,260 Z" fill="#D4AF37"/>
                    <circle cx="250" cy="220" r="25" fill="#D4AF37"/>
                </g>
                <!-- القاعدة الهلالية الخاصة بالهيئة -->
                <path d="M80,370 Q250,470 420,370 C410,410 330,440 250,440 C170,440 90,410 80,370 Z" fill="#2e4b33" stroke="#D4AF37" stroke-width="8"/>
                <!-- النص العربي داخل الشعار -->
                <text x="250" y="415" font-size="28" font-weight="bold" fill="#D4AF37" text-anchor="middle" font-family="Segoe UI, Tahoma">هيئة الدفاع المدني والإسعاف</text>
            </svg>
        </div>

        <div class="authority-badge">هيئة الدفاع المدني والإسعاف &bull; سلطنة عمان</div>
        
        <!-- حقل اسم الضيف واللقب المفتوح -->
        <div class="patronage">
            تَحْتَ رِعَايَةِ <span>[ سعادة / معالي الضيف الموقر ]</span>
        </div>

        <h1>حَفْلُ تَدْشِينِ الأَنْظُمَةِ الطِّبِّيَّةِ الذَّكِيَّةِ</h1>
        <p>نظام التقارير الطبية الإلكتروني &bull; نظام الإشراف الطبي الميداني</p>
        
        <div class="launch-btn-wrapper">
            <button class="launch-btn" onclick="startLaunch()">
                <span>اضغط هنا</span>
                <span style="font-size: 1.1rem; font-weight: normal; color: #cbd5e1;">للتدشين</span>
            </button>
        </div>
    </div>

    <div id="video-container">
        <button class="back-btn" onclick="resetPage()">إعادة ضبط الشاشة</button>
        <video id="promo-video" controls>
            <source src="video.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playLaunchSound() {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.6); 

                gainNode.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch (e) {
                console.log("Audio not supported");
            }
        }

        function startLaunch() {
            playLaunchSound();

            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            launchContainer.style.opacity = '0';
            launchContainer.style.transform = 'scale(0.9)';

            setTimeout(() => {
                launchContainer.style.display = 'none';
                videoContainer.classList.add('active');
                video.play();
            }, 600);
        }

        function resetPage() {
            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            video.pause();
            video.currentTime = 0;
            videoContainer.classList.remove('active');

            setTimeout(() => {
                launchContainer.style.display = 'block';
                setTimeout(() => {
                    launchContainer.style.opacity = '1';
                    launchContainer.style.transform = 'scale(1)';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
