<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل التدشين - هيئة الدفاع المدني والإسعاف</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b261d 0%, #080d09 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
            perspective: 1000px;
        }

        /* تأثير النقاط الذهبية في الخلفية */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(212, 175, 55, 0.12) 1.5px, transparent 1.5px);
            background-size: 45px 45px;
            pointer-events: none;
            animation: backgroundPan 25s linear infinite;
        }

        @keyframes backgroundPan {
            0% { background-position: 0 0; }
            100% { background-position: 45px 45px; }
        }

        #launch-container {
            text-align: center;
            transition: all 1s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 20px;
            z-index: 10;
            max-width: 900px;
            animation: fadeInDown 1.5s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تصميم حاوية الشعار المرفق */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: float-logo 4s ease-in-out infinite;
            position: relative;
        }

        /* الشعار المرفق مع التأثيرات ثلاثية الأبعاد */
        .authority-logo-img {
            width: 200px; /* يمكنك تعديل الحجم من هنا */
            height: auto;
            /* تأثير الظل العميق والتوهج الذهبي ليبدو مجسماً */
            filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.9)) 
                    drop-shadow(0 0 25px rgba(212, 175, 55, 0.5))
                    contrast(1.1) brightness(1.1);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .authority-logo-img:hover {
            transform: scale(1.08) rotateY(12deg) rotateX(5deg);
        }

        /* تأثير اللمعان المتحرك فوق الشعار */
        .logo-glare {
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: glare 4s infinite;
            pointer-events: none;
        }

        @keyframes glare {
            0% { left: -100%; }
            20% { left: 150%; }
            100% { left: 150%; }
        }

        @keyframes float-logo {
            0%, 100% { transform: translateY(0) rotateX(0deg); }
            50% { transform: translateY(-12px) rotateX(4deg); }
        }

        .authority-badge {
            font-size: 1.1rem;
            color: #D4AF37;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .patronage {
            font-size: 1.5rem;
            color: #E2E8F0;
            margin-bottom: 25px;
            font-weight: 500;
            text-shadow: 0 4px 8px rgba(0,0,0,0.9);
            letter-spacing: 1px;
        }

        .patronage span {
            color: #D4AF37;
            font-weight: 800;
            border-bottom: 2px dashed #D4AF37;
            padding-bottom: 4px;
            display: inline-block;
            animation: pulseText 2s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, #ffffff 20%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.4;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* تصميم الزر 3D */
        .launch-btn-wrapper {
            position: relative;
            display: inline-block;
            padding: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 70%);
            animation: pulse-glow 3s infinite;
        }

        .launch-btn {
            background: linear-gradient(135deg, #2e4b33 0%, #0e1710 100%);
            color: #D4AF37;
            border: 4px solid #D4AF37;
            width: 230px;
            height: 230px;
            font-size: 1.7rem;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.8), 
                inset 0 5px 20px rgba(212,175,55,0.3),
                inset 0 -5px 20px rgba(0,0,0,0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.5;
            outline: none;
            position: relative;
            overflow: hidden;
        }

        .launch-btn::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(30deg);
            transition: all 0.5s;
            opacity: 0;
        }

        .launch-btn:hover::after {
            opacity: 1;
            left: 100%;
            transition: all 1s;
        }

        .launch-btn:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 
                0 30px 60px rgba(212, 175, 55, 0.4), 
                inset 0 5px 30px rgba(212,175,55,0.6),
                inset 0 -5px 20px rgba(0,0,0,0.8);
            color: #fff;
        }

        .launch-btn:active {
            transform: scale(0.95) translateY(0);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* شاشة الفيديو */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
            z-index: 1000;
        }

        #video-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(14, 23, 16, 0.8);
            color: #D4AF37;
            border: 2px solid #D4AF37;
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            z-index: 1001;
            font-family: 'Tajawal', sans-serif;
        }

        .back-btn:hover {
            background: #D4AF37;
            color: #0e1710;
            transform: scale(1.05);
        }

        /* التجاوب مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 1rem; }
            .authority-logo-img { width: 150px; }
            .launch-btn { width: 180px; height: 180px; font-size: 1.4rem; }
            .patronage { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="launch-container">
        <!-- حاوية الشعار المرفق -->
        <div class="logo-container">
            <!-- ضع صورة الشعار المرفقة في نفس المجلد وسمها logo.png -->
            <img src="logo.png" alt="شعار هيئة الدفاع المدني والإسعاف" class="authority-logo-img">
            <div class="logo-glare"></div>
        </div>

        <div class="authority-badge">هيئة الدفاع المدني والإسعاف &bull; سلطنة عمان</div>
        
        <div class="patronage">
            تَحْتَ رِعَايَةِ <span>[ سعادة / معالي الضيف الموقر ]</span>
        </div>

        <h1>حَفْلُ تَدْشِينِ الأَنْظُمَةِ الطِّبِّيَّةِ الذَّكِيَّةِ</h1>
        <p>نظام التقارير الطبية الإلكتروني &bull; نظام الإشراف الطبي الميداني</p>
        
        <div class="launch-btn-wrapper">
            <button class="launch-btn" onclick="startLaunch()">
                <span>اضغط للتدشين</span>
                <span style="font-size: 1rem; font-weight: normal; color: #cbd5e1; margin-top: 5px;">ابدأ العرض</span>
            </button>
        </div>
    </div>

    <div id="video-container">
        <button class="back-btn" onclick="resetPage()">&#8592; إعادة ضبط الشاشة</button>
        <video id="promo-video" controls>
            <source src="video.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // مؤثر صوتي سينمائي (Swoosh + Impact + Chime)
        function playCinematicSound() {
            try {
                initAudio();
                const now = audioCtx.currentTime;

                // 1. Swoosh
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(200, now);
                osc1.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain1.gain.setValueAtTime(0, now);
                gain1.gain.linearRampToValueAtTime(0.2, now + 0.2);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.start(now);
                osc1.stop(now + 0.4);

                // 2. Impact
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(150, now + 0.4);
                osc2.frequency.exponentialRampToValueAtTime(40, now + 1.5);
                gain2.gain.setValueAtTime(0, now + 0.4);
                gain2.gain.linearRampToValueAtTime(0.5, now + 0.45);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start(now + 0.4);
                osc2.stop(now + 1.5);

                // 3. Chime
                const osc3 = audioCtx.createOscillator();
                const gain3 = audioCtx.createGain();
                osc3.type = 'sine';
                osc3.frequency.setValueAtTime(1046.50, now + 0.6);
                gain3.gain.setValueAtTime(0, now + 0.6);
                gain3.gain.linearRampToValueAtTime(0.15, now + 0.7);
                gain3.gain.exponentialRampToValueAtTime(0.01, now + 2.0);
                osc3.connect(gain3);
                gain3.connect(audioCtx.destination);
                osc3.start(now + 0.6);
                osc3.stop(now + 2.0);

            } catch (e) {
                console.log("Audio blocked.");
            }
        }

        function startLaunch() {
            playCinematicSound();

            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            // تأثير التلاشي السينمائي
            launchContainer.style.opacity = '0';
            launchContainer.style.transform = 'scale(1.1) translateZ(100px)';
            launchContainer.style.filter = 'blur(10px)';

            setTimeout(() => {
                launchContainer.style.display = 'none';
                videoContainer.classList.add('active');
                video.play().catch(error => console.log("Auto-play blocked."));
            }, 800);
        }

        function resetPage() {
            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            video.pause();
            video.currentTime = 0;
            videoContainer.classList.remove('active');

            setTimeout(() => {
                launchContainer.style.display = 'block';
                setTimeout(() => {
                    launchContainer.style.opacity = '1';
                    launchContainer.style.transform = 'scale(1) translateZ(0)';
                    launchContainer.style.filter = 'blur(0)';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
