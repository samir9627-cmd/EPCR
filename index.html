<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل تدشين الأنظمة الطبية الذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0B192C 0%, #030712 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* خلفية مزخرفة فاخرة خفيفة */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(212, 175, 55, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        #launch-container {
            text-align: center;
            transition: all 0.8s ease-in-out;
            padding: 20px;
            z-index: 10;
            max-width: 800px;
        }

        /* شعار وزارة الصحة أو الهيئة المعتمد */
        .royal-logo {
            font-size: 1.2rem;
            color: #D4AF37;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .patronage {
            font-size: 1.4rem;
            color: #E2E8F0;
            margin-bottom: 15px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .patronage span {
            color: #D4AF37;
            font-weight: 700;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            background: linear-gradient(135deg, #fff 30%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 50px;
            letter-spacing: 0.5px;
        }

        /* زر التدشين الملكي الفاخر */
        .launch-btn-wrapper {
            position: relative;
            display: inline-block;
            padding: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212,175,55,0.4), transparent);
            animation: pulse-glow 3s infinite;
        }

        .launch-btn {
            background: radial-gradient(circle at 30% 30%, #1e40af 0%, #0f172a 100%);
            color: #D4AF37;
            border: 4px solid #D4AF37;
            width: 220px;
            height: 220px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 5px 15px rgba(212,175,55,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.5;
        }

        .launch-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 45px rgba(212, 175, 55, 0.5), inset 0 5px 20px rgba(212,175,55,0.5);
            background: radial-gradient(circle at 30% 30%, #1d4ed8 0%, #1e293b 100%);
            color: #fff;
        }

        .launch-btn:active {
            transform: scale(0.98);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 20px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* حاوية الفيديو */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 1000;
        }

        #video-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
            z-index: 1001;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="launch-container">
        <div class="royal-logo">MINISTRY OF HEALTH &bull; سلطنة عمان</div>
        <div class="patronage">تَحْتَ رِعَايَةِ مَعَالِي وَزِيرِ الصّحَّةِ الموقّر</div>
        <h1>حَفْلُ تَدْشِينِ الأَنْظُمَةِ الطِّبِّيَّةِ الذَّكِيَّةِ</h1>
        <p>نظام التقارير الطبية الإلكتروني &bull; نظام الإشراف الطبي الميداني</p>
        
        <div class="launch-btn-wrapper">
            <button class="launch-btn" onclick="startLaunch()">
                <span>اضغط هنا</span>
                <span style="font-size: 1.2rem; font-weight: normal; color: #cbd5e1;">للتدشين</span>
            </button>
        </div>
    </div>

    <div id="video-container">
        <button class="back-btn" onclick="resetPage()">إعادة ضبط الشاشة</button>
        <video id="promo-video" controls>
            <source src="video.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>

    <script>
        function startLaunch() {
            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            launchContainer.style.opacity = '0';
            launchContainer.style.transform = 'scale(0.9)';

            setTimeout(() => {
                launchContainer.style.display = 'none';
                videoContainer.classList.add('active');
                video.play();
            }, 600);
        }

        function resetPage() {
            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            video.pause();
            video.currentTime = 0;
            videoContainer.classList.remove('active');

            setTimeout(() => {
                launchContainer.style.display = 'block';
                setTimeout(() => {
                    launchContainer.style.opacity = '1';
                    launchContainer.style.transform = 'scale(1)';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
