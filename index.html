<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل التدشين - هيئة الدفاع المدني والإسعاف</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* درجات ألوان الهوية: الزيتي العسكري الغامق مع الأسود الفاخر */
            background: radial-gradient(circle at center, #1b261d 0%, #080d09 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        /* خلفية زخرفية ملكية خفيفة */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1.5px, transparent 1.5px);
            background-size: 35px 35px;
            pointer-events: none;
        }

        #launch-container {
            text-align: center;
            transition: all 0.8s ease-in-out;
            padding: 20px;
            z-index: 10;
            max-width: 900px;
        }

        /* شعار الجهة */
        .authority-badge {
            font-size: 1.1rem;
            color: #D4AF37;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* مكان اسم الضيف واللقب المفتوح لتعديله لاحقاً */
        .patronage {
            font-size: 1.5rem;
            color: #E2E8F0;
            margin-bottom: 20px;
            font-weight: 500;
            text-shadow: 0 2px 5px rgba(0,0,0,0.7);
            letter-spacing: 0.5px;
        }

        .patronage span {
            color: #D4AF37;
            font-weight: 800;
            border-bottom: 2px dashed #D4AF37;
            padding-bottom: 2px;
        }

        h1 {
            font-size: 2.7rem;
            margin-bottom: 12px;
            color: #ffffff;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
            background: linear-gradient(135deg, #fff 20%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 45px;
            letter-spacing: 0.5px;
        }

        /* تأثير التوهج النبضي للزر */
        .launch-btn-wrapper {
            position: relative;
            display: inline-block;
            padding: 15px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212,175,55,0.4), rgba(46,75,51,0.2));
            animation: pulse-glow 2.5s infinite;
        }

        /* تصميم زر التدشين الفخم المستوحى من الهوية العسكرية والذهبية */
        .launch-btn {
            background: radial-gradient(circle at 30% 30%, #2e4b33 0%, #0e1710 100%);
            color: #D4AF37;
            border: 4px solid #D4AF37;
            width: 230px;
            height: 230px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), inset 0 5px 20px rgba(212,175,55,0.35);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.5;
            outline: none;
        }

        .launch-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.6), inset 0 5px 25px rgba(212,175,55,0.6);
            background: radial-gradient(circle at 30% 30%, #3a5e41 0%, #152217 100%);
            color: #fff;
        }

        .launch-btn:active {
            transform: scale(0.96);
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5); }
            70% { transform: scale(1.04); box-shadow: 0 0 0 25px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* حاوية الفيديو */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
            z-index: 1000;
        }

        #video-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: background 0.3s;
            z-index: 1001;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <div id="launch-container">
        <div class="authority-badge">هيئة الدفاع المدني والإسعاف &bull; سلطنة عمان</div>
        
        <!-- حقل اسم الضيف واللقب مفتوح وقابل للتعديل لاحقاً بسهولة -->
        <div class="patronage">
            تَحْتَ رِعَايَةِ <span>[ سعادة / معالي الضيف الموقر ]</span>
        </div>

        <h1>حَفْلُ تَدْشِينِ الأَنْظُمَةِ الطِّبِّيَّةِ الذَّكِيَّةِ</h1>
        <p>نظام التقارير الطبية الإلكتروني &bull; نظام الإشراف الطبي الميداني</p>
        
        <div class="launch-btn-wrapper">
            <button class="launch-btn" onclick="startLaunch()">
                <span>اضغط هنا</span>
                <span style="font-size: 1.2rem; font-weight: normal; color: #cbd5e1;">للتدشين</span>
            </button>
        </div>
    </div>

    <div id="video-container">
        <button class="back-btn" onclick="resetPage()">إعادة ضبط الشاشة</button>
        <video id="promo-video" controls>
            <source src="video.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>

    <script>
        // نظام توليد المؤثرات الصوتية والموسيقى التفاعلية (Web Audio API) لتجنب أخطاء روابط الصوت الخارجية
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // تشغيل نغمة فخمة عند الضغط (صفير أو جرس تدشين تفاعلي)
        function playLaunchSound() {
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // نغمة هادفة ومهيبة للحظة التدشين
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime); // نغمة أساسية A4
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5); // تصاعدي

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        function startLaunch() {
            playLaunchSound(); // تشغيل الصوت فور الضغط

            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            launchContainer.style.opacity = '0';
            launchContainer.style.transform = 'scale(0.9)';

            setTimeout(() => {
                launchContainer.style.display = 'none';
                videoContainer.classList.add('active');
                video.play();
            }, 600);
        }

        function resetPage() {
            const launchContainer = document.getElementById('launch-container');
            const videoContainer = document.getElementById('video-container');
            const video = document.getElementById('promo-video');

            video.pause();
            video.currentTime = 0;
            videoContainer.classList.remove('active');

            setTimeout(() => {
                launchContainer.style.display = 'block';
                setTimeout(() => {
                    launchContainer.style.opacity = '1';
                    launchContainer.style.transform = 'scale(1)';
                }, 50);
            }, 500);
        }
    </script>
</body>
</html>
